---
# cPanel deployment for Libra (Laravel 12).
#
# TOPOLOGY (confirmed from public_html/index.php: it loads ../libra and sets public path to itself)
#   $DEPLOYPATH = /home/librazad/repositories/libra   git staging checkout (this repo)
#   APP         = /home/librazad/libra                 LIVE Laravel app  (code runs from here)
#   DOCROOT     = /home/librazad/public_html           web root          (Laravel public assets)
#
# WHAT THIS DOES
#   1. Copies the freshly checked-out code from the staging repo into the live app (~/libra).
#   2. Copies the public assets (images/, favicons, robots.txt) into the web root (~/public_html).
#   3. Clears Laravel's caches on the live app so the new code + views take effect.
#
# WHAT IT PRESERVES (never overwritten or deleted)
#   live app:  .env, storage/, vendor/         (secrets, runtime state, installed dependencies)
#   web root:  index.php, .htaccess, .well-known/   (your customized bootstrap + server files)
#
# SAFETY: STARTS IN DRY-RUN.
#   The first deploy only PRINTS what it would copy and changes nothing on the live site.
#   Read the deploy log. When the file list looks right (no .env, no index.php, and it lists
#   images/Cjenik-Libra-2026.png), change the line below to  DRYRUN=""  and deploy again to apply.
#
# NOT HANDLED HERE: front-end build assets (public/build) are gitignored and shipped as
#   public/build.zip. Only relevant when JS/CSS changes. Your current changes do not need it.

deployment:
  tasks:
    - export DRYRUN="-n"        # <-- change to   DRYRUN=""   to apply changes for real
    - export SRC=$DEPLOYPATH
    - export APP=/home/librazad/libra
    - export DOCROOT=/home/librazad/public_html
    - export PHP=$(command -v php || echo /usr/local/bin/php)
    - echo "DRYRUN=[$DRYRUN] SRC=$SRC APP=$APP DOCROOT=$DOCROOT PHP=$PHP"
    # 1) App code -> live app. Preserve live secrets/state/deps; public assets handled in step 2.
    - rsync -a $DRYRUN -v --exclude='.git/' --exclude='.env' --exclude='storage/' --exclude='vendor/' --exclude='node_modules/' --exclude='public/' $SRC/ $APP/
    # 2) Public assets -> web root. Preserve custom index.php/.htaccess/.well-known; skip build artifacts.
    - rsync -a $DRYRUN -v --exclude='index.php' --exclude='.htaccess' --exclude='.well-known/' --exclude='build/' --exclude='build.zip' $SRC/public/ $DOCROOT/
    # 3) Refresh caches on the LIVE app (safe/idempotent; takes effect once code is really copied).
    - $PHP $APP/artisan optimize:clear
    # Optional -- uncomment only when they apply:
    # - cd $APP && composer install --no-dev --optimize-autoloader --no-interaction   # only if composer.lock changed
    # - $PHP $APP/artisan migrate --force                                             # only if there are new migrations
