---
# cPanel deployment for Libra (Laravel 12).
#
# TOPOLOGY (confirmed from public_html/index.php: it loads ../libra and sets public path to itself)
#   SRC     = /home/librazad/repositories/libra   git staging checkout (this repo)
#   APP     = /home/librazad/libra                 LIVE Laravel app  (code runs from here)
#   DOCROOT = /home/librazad/public_html           web root          (index.php loads ../libra)
#
# This host has NO rsync and does NOT export $DEPLOYPATH, so paths are hardcoded and we use cp.
#
# SAFE BY CONSTRUCTION:
#   - Copies ONLY the application code listed below + public/images. Because .env, storage/,
#     vendor/, public/index.php and public/.htaccess are never in the copy set, your live
#     secrets, runtime state, dependencies and customized bootstrap are left untouched.
#   - Copies are overlays (cp), never deletions -- nothing on the live site is removed.
#   - The SQLite database (database/database.sqlite) is gitignored, so it is never in this
#     repo and a copy cannot clobber it. NEVER commit a .sqlite file to this repo.
#
# ONGOING WORKFLOW: edit in git -> push -> "Update from Remote" -> "Deploy HEAD Commit".
#   Never edit files directly on the server; that makes the repo dirty and greys out Deploy.

deployment:
  tasks:
    - export SRC=/home/librazad/repositories/libra
    - export APP=/home/librazad/libra
    - export DOCROOT=/home/librazad/public_html
    - export PHP=$(command -v php || echo /usr/local/bin/php)
    - echo "SRC=$SRC APP=$APP DOCROOT=$DOCROOT PHP=$PHP"
    # 1) Application code -> live app (explicit allow-list; .env/storage/vendor/public excluded by omission).
    - cp -av $SRC/app $SRC/bootstrap $SRC/config $SRC/routes $SRC/resources $SRC/artisan $SRC/composer.json $SRC/composer.lock $APP/
    # 1b) Migrations only -- never the sqlite data file.
    - cp -av $SRC/database/migrations $APP/database/
    # 2) Public assets -> web root (only images; index.php and .htaccess are never touched).
    - cp -av $SRC/public/images/. $DOCROOT/images/
    # 3) Clear caches without depending on the CLI PHP version (robust), then best-effort artisan.
    - rm -f $APP/bootstrap/cache/*.php
    - find $APP/storage/framework/views -type f -name '*.php' -delete 2>/dev/null || true
    - $PHP $APP/artisan optimize:clear || true
    # Optional -- uncomment only when they apply:
    # - cd $APP && composer install --no-dev --optimize-autoloader --no-interaction   # only if composer.lock changed
    # - $PHP $APP/artisan migrate --force                                             # only if there are new migrations
