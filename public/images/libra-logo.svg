<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <!-- Warm gradient for the bulb glow -->
    <radialGradient id="bulbGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFE566" />
      <stop offset="60%" stop-color="#FFCC00" />
      <stop offset="100%" stop-color="#F5A623" />
    </radialGradient>
    <!-- Subtle outer glow -->
    <radialGradient id="outerGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFCC00" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFCC00" stop-opacity="0" />
    </radialGradient>
    <!-- Text gradient for depth -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4411E" />
      <stop offset="100%" stop-color="#B8341A" />
    </linearGradient>
  </defs>

  <!-- Outer glow behind bulb -->
  <circle cx="148" cy="90" r="52" fill="url(#outerGlow)" />

  <!-- ===== L ===== -->
  <text x="18" y="122" font-family="'Poppins', 'Nunito', 'Segoe UI', sans-serif" font-size="112" font-weight="800" fill="url(#textGrad)" letter-spacing="-2">L</text>

  <!-- ===== LIGHTBULB (replaces I) ===== -->
  <g transform="translate(148, 92)">
    <!-- Ray lines -->
    <g stroke="#F5A623" stroke-width="2.8" stroke-linecap="round" opacity="0.85">
      <line x1="0"  y1="-42" x2="0"  y2="-52" />
      <line x1="28" y1="-32" x2="36" y2="-40" />
      <line x1="-28" y1="-32" x2="-36" y2="-40" />
      <line x1="38" y1="-10" x2="48" y2="-12" />
      <line x1="-38" y1="-10" x2="-48" y2="-12" />
    </g>
    <!-- Bulb glass -->
    <path d="
      M -18 8
      C -18 8 -24 -4 -24 -16
      C -24 -32 -14 -40 0 -40
      C 14 -40 24 -32 24 -16
      C 24 -4 18 8 18 8
      Z
    " fill="url(#bulbGlow)" stroke="#3D3D3D" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Filament -->
    <path d="M -6 -8 Q -3 -20 0 -12 Q 3 -4 6 -16" fill="none" stroke="#A07820" stroke-width="2" stroke-linecap="round"/>
    <!-- Screw base -->
    <rect x="-14" y="8" width="28" height="6" rx="2" fill="#5C5C5C" stroke="#3D3D3D" stroke-width="1.5"/>
    <rect x="-12" y="14" width="24" height="5" rx="2" fill="#6E6E6E" stroke="#3D3D3D" stroke-width="1.5"/>
    <rect x="-10" y="19" width="20" height="5" rx="2.5" fill="#5C5C5C" stroke="#3D3D3D" stroke-width="1.5"/>
    <!-- Base tip -->
    <path d="M -6 24 Q 0 30 6 24" fill="#4A4A4A" stroke="#3D3D3D" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- ===== BRA ===== -->
  <text x="210" y="122" font-family="'Poppins', 'Nunito', 'Segoe UI', sans-serif" font-size="112" font-weight="800" fill="url(#textGrad)" letter-spacing="-2">BRA</text>

  <!-- Tagline -->
  <text x="260" y="150" font-family="'Poppins', 'Nunito', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#8A6A5E" letter-spacing="5" text-anchor="middle">OBRT ZA PODUKU</text>
</svg>
